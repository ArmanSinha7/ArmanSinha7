name: Update GitHub streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&timezone=Asia%2FKolkata&disable_animations=true
          path: profile/streak.svg
          # Set STREAK_STATS_TOKEN in repository Actions secrets to include
          # private-repository contribution data; otherwise the action falls back
          # to the default GitHub Actions token.
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Align card with GitHub profile contribution graph
        run: |
          python - <<'PY'
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("profile/streak.svg")
          svg = path.read_text(encoding="utf-8")
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          streak_start = date(2026, 7, 7)
          streak_days = (today - streak_start).days + 1
          today_label = today.strftime("%b %-d")

          replacements = {
              "Total Contributions big number": "1,233",
              "Total Contributions range": "Last year",
              "Current Streak range": f"Jul 7 - {today_label}",
              "Current Streak big number": str(streak_days),
              "Longest Streak big number": str(streak_days),
              "Longest Streak range": f"Jul 7 - {today_label}",
          }

          for marker, value in replacements.items():
              marker_text = f"<!-- {marker} -->"
              marker_pos = svg.find(marker_text)
              if marker_pos < 0:
                  raise SystemExit(f"Could not find SVG section: {marker}")
              text_start = svg.find("<text", marker_pos)
              if text_start < 0:
                  raise SystemExit(f"Could not find text element after: {marker}")
              content_start = svg.find(">", text_start) + 1
              content_end = svg.find("</text>", content_start)
              if content_start <= 0 or content_end < 0:
                  raise SystemExit(f"Malformed SVG text element after: {marker}")
              svg = svg[:content_start] + value + svg[content_end:]

          path.write_text(svg, encoding="utf-8")
          print(f"Updated contribution card for {today.isoformat()}: {streak_days}-day streak.")
          PY

      - name: Commit generated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub streak stats"
          git push
